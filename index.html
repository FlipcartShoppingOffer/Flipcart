<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Hub</title>

<style>

body{
background:#f8f8f8;
font-family:Arial, sans-serif;
margin:0;
}

h1{
background:#2874F0;
color:white;
padding:15px;
text-align:center;
margin:0;
}

.container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card p{
text-align:center;
font-weight:bold;
padding:10px;
}

.card a{
text-decoration:none;
color:black;
}

.header{
background:#2874F0;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 18px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:22px;
font-weight:bold;
}

.icons{
display:flex;
gap:15px;
font-size:22px;
}
.search-box{
padding:10px 15px;
background:white;
}

.search-box input{
width:100%;
padding:12px;
font-size:16px;
border:none;
border-radius:8px;
background:#f1f3f6;
box-sizing:border-box;
outline:none;
}

</style>

</head>

<body>

<div class="header">
    <div class="logo">🛍️ Shopping Hub</div>
    <div class="icons">🔍 ❤️ 🛒</div>
</div>

</a>
</div>

<div class="card">

</body>
</html>
