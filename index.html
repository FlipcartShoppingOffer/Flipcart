<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Hub</title>

<style>

body{
background:#4A0D1A;
font-family:Arial, sans-serif;
margin:0;
}

h1{
background:#2874F0;
color:white;
padding:15px;
text-align:center;
margin:0;
}

.container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.card img{
width:100%;
height:320px;
object-fit:contain;
background:white;
}

.card p{
text-align:center;
font-weight:bold;
padding:10px;
}

.card a{
text-decoration:none;
color:black;
}

.header{
background:#2874F0;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 18px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:22px;
font-weight:bold;
}

.icons{
display:flex;
gap:15px;
font-size:22px;
}
.search-box{
padding:10px 15px;
background:white;
}

.search-box input{
width:100%;
padding:14px;
font-size:16px;
border:none;
border-radius:12px;
background:#F8F1E7;
box-sizing:border-box;
outline:none;
color:#333;
    }
.offer-banner{
padding:0 15px 15px;
}

.offer-banner img{
width:100%;
display:block;
border-radius:15px;
box-shadow:0 4px 12px rgba(0,0,0,.15);
    }

.popup-box{
/* ===== Premium Spin Wheel ===== */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.popup-box{
background:#fff;
width:330px;
max-width:92%;
padding:20px;
border-radius:20px;
text-align:center;
position:relative;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.close-btn{
position:absolute;
top:10px;
right:15px;
font-size:28px;
font-weight:bold;
cursor:pointer;
color:#555;
}

.close-btn:hover{
color:red;
}

.pointer{
font-size:35px;
margin-bottom:-8px;
}

.wheel{
width:260px;
height:260px;
margin:0 auto;
border-radius:50%;
border:8px solid #fff;
box-shadow:0 5px 20px rgba(0,0,0,.25);
position:relative;
overflow:hidden;
transition:transform 5s cubic-bezier(.17,.67,.18,1);
background:
conic-gradient(
#ff3b30 0deg 60deg,
#ff9500 60deg 120deg,
#ffd60a 120deg 180deg,
#34c759 180deg 240deg,
#007aff 240deg 300deg,
#af52de 300deg 360deg
);
}

.slice{
position:absolute;
width:50%;
height:50%;
left:50%;
top:50%;
transform-origin:0% 0%;
font-size:15px;
font-weight:bold;
color:white;
text-shadow:1px 1px 2px black;
}

.slice span{
position:absolute;
left:70px;
top:15px;
transform:rotate(90deg);
}

.s1{transform:rotate(0deg);}
.s2{transform:rotate(60deg);}
.s3{transform:rotate(120deg);}
.s4{transform:rotate(180deg);}
.s5{transform:rotate(240deg);}
.s6{transform:rotate(300deg);}

.spin-btn{
margin-top:20px;
padding:12px 35px;
font-size:20px;
border:none;
border-radius:10px;
background:#2874F0;
color:white;
font-weight:bold;
cursor:pointer;
}

.claim-btn{
display:none;
margin-top:15px;
padding:12px 28px;
background:#28a745;
color:white;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#result{
margin-top:15px;
font-size:22px;
font-weight:bold;
color:#0a8f2f;
    }
</style>

</head>

<body>

<div class="header">
    <div class="logo">🛍️ Shopping Hub</div>
    <div class="icons">🔍 ❤️ 🛒</div>
</div>
<div class="search-box">
    <input type="text" placeholder="🔍 Search for products...">
</div>
    <div class="offer-banner">
    <a href="https:youtube.com" target="_blank">
       <img src="file_000000004970820bbfe028a730e93a56.png" alt="Offer Banner">
    </a>
    </div>
<div class="container">

<div class="card">

    <span style="color:red;font-size:28px;font-weight:bold;">₹199</span>
    <span style="color:green;font-weight:bold;">80% OFF</span><br>
    Full Set
</p>
</a>
</div>

<div class="card">
<a href="https:youtube.com/" target="_blank">
<img src="file_0000000087d88211a09940ddf1fcc15f.png">
<p>
    <del>₹999</del><br>
    <span style="color:red;font-size:28px;font-weight:bold;">₹199</span>
    <span style="color:green;font-weight:bold;">80% OFF</span><br>
    Full Set
</p>
</a>
</div>
    
<div class="card">
<a href="https://your-product-link.com" target="_blank">
<img src="suit03.png">
<p>
    <del>₹999</del><br>
    <span style="color:red;font-size:28px;font-weight:bold;">₹199</span>
    <span style="color:green;font-weight:bold;">80% OFF</span><br>
    Full Set
</p>
</a>
</div>
    
<div class="card">
<a href="https://your-product-link-4.com" target="_blank">
<img src="suit4.png">
<p>
    <del>₹999</del><br>
    <span style="color:red;font-size:28px;font-weight:bold;">₹199</span>
    <span style="color:green;font-weight:bold;">80% OFF</span><br>
    Full Set
</p>
</a>
</div>

</div>   
<div id="wheelPopup" class="popup">

  <div class="popup-box">

    <span class="close-btn" onclick="closeWheel()">&times;</span>

    <h2>🎁 Spin & Win</h2>

    <div class="pointer">▼</div>

    <div id="wheel" class="wheel">

      <div class="slice s1"><span>10% OFF</span></div>
      <div class="slice s2"><span>20% OFF</span></div>
      <div class="slice s3"><span>30% OFF</span></div>
      <div class="slice s4"><span>50% OFF</span></div>
      <div class="slice s5"><span>70% OFF</span></div>
      <div class="slice s6"><span>80% OFF</span></div>

    </div>

    <button class="spin-btn" onclick="spinWheel()">SPIN</button>

    <p id="result"></p>

    <button id="claimBtn" class="claim-btn" onclick="closeWheel()">
      🎁 Claim Offer
    </button>

  </div>
</div>  
    
<script>

let spun = false;

function spinWheel(){

if(spun) return;

spun = true;

let wheel = document.getElementById("wheel");

wheel.style.transform = "rotate(2100deg)";

setTimeout(function(){

document.getElementById("result").innerHTML =
"🎉 Congratulations!<br><b>You Won 80% OFF</b>";

document.getElementById("claimBtn").style.display = "inline-block";

},5000);

}

function closeWheel(){

document.getElementById("wheelPopup").style.display="none";

}

</script>
    
</body>
</html>
